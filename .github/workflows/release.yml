name: Release

# 推送形如 v1.1.0 的 tag 时，自动在 Windows 上打包并创建 Release。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cx_Freeze

      - name: Prepare assets
        run: python scripts/prepare_assets.py

      - name: Build with cx_Freeze
        run: python packaging/setup_cx.py build

      - name: Package artifact (zip)
        shell: powershell
        run: |
          $dir = Get-ChildItem -Path build -Directory -Filter "exe.*" | Select-Object -First 1
          Compress-Archive -Path "$($dir.FullName)\*" -DestinationPath "DesktopPet-win64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: DesktopPet-win64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
