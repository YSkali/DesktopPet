name: Fetch GitHub Android APK (temp)

on:
  push:
    paths:
      - '.github/workflows/fetch-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Decide action (fetch or cleanup)
        id: decide
        run: |
          MSG="${{ github.event.head_commit.message }}"
          if echo "$MSG" | grep -qi '\[cleanup\]'; then
            echo "mode=cleanup" >> "$GITHUB_OUTPUT"
          else
            echo "mode=fetch" >> "$GITHUB_OUTPUT"
          fi

      - name: Curl mirror sources
        if: steps.decide.outputs.mode == 'fetch'
        run: |
          set +e
          : > diag.txt
          dbg() { echo "$@" | tee -a diag.txt; }
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"

          trydl() {
            name="$1"; url="$2"; ref="$3"
            [ -z "$url" ] && { dbg "$name: no url"; return 1; }
            code=$(curl -sL -A "$UA" ${ref:+-e "$ref"} --max-time 300 -o github-app-file -w "%{http_code}" "$url")
            sz=$(stat -c%s github-app-file 2>/dev/null || echo 0)
            mg=$(head -c 2 github-app-file 2>/dev/null)
            dbg "$name: http=$code size=$sz magic=$mg url=$(echo "$url" | head -c 160)"
            if [ "$mg" = "PK" ] && [ "$sz" -gt 10000000 ]; then return 0; fi
            rm -f github-app-file; return 1
          }

          # ---- Uptodown versions API (revanced trick) ----
          if [ ! -f github-app-file ]; then
            dbg "=== uptodown API ==="
            curl -sL -A "$UA" --max-time 60 "https://github-android.en.uptodown.com/android/versions" -o /tmp/utd.html
            dbg "versions page size: $(stat -c%s /tmp/utd.html 2>/dev/null || echo 0)"
            grep -oE 'href="[^"]*"' /tmp/utd.html | grep -iE 'download|version|apps/' | sort -u | head -15 | while read -r l; do dbg "  vlink: $l"; done
            vurl=$(grep -oE 'href="https://github-android\.en\.uptodown\.com/android/download/[0-9]+[^"]*"' /tmp/utd.html | head -1 | sed 's/href="//;s/"$//')
            [ -z "$vurl" ] && vurl=$(grep -oE '"versionURL":"[^"]+"' /tmp/utd.html | head -1 | sed 's/"versionURL":"//;s/"$//' | sed 's#\\/#/#g')
            [ -z "$vurl" ] && vurl=$(grep -oE 'href="[^"]*download[^"]*"' /tmp/utd.html | grep -v play.google | head -1 | sed 's/href="//;s/"$//')
            dbg "version url: $vurl"
            if [ -n "$vurl" ]; then
              curl -sL -A "$UA" -e "https://github-android.en.uptodown.com/android/versions" --max-time 60 "$vurl" -o /tmp/utov.html
              dbg "version page size: $(stat -c%s /tmp/utov.html 2>/dev/null || echo 0)"
              grep -oE 'https://dw\.uptodown\.com[^"]*' /tmp/utov.html | head -3 | while read -r l; do dbg "  dw: $l"; done
              u=$(grep -oE 'https://dw\.uptodown\.com[^"]+' /tmp/utov.html | head -1)
              trydl uptodown-api "$u" "$vurl" || true
            fi
          fi

          # ---- APKPure CDN direct (apkeep trick: official client UA) ----
          if [ ! -f github-app-file ]; then
            dbg "=== d.apkpure.com ==="
            for PUR_UA in "APKPure/3.19.39 (Aegon)" "APKPure/3.20.16 (Aegon)" "Dalvik/2.1.0 (Linux; U; Android 13; Pixel 7 Build/TQ3A.230805.001)"; do
              code=$(curl -sL -A "$PUR_UA" -H "Accept: */*" --max-time 300 -o github-app-file -w "%{http_code}" "https://d.apkpure.com/b/APK/com.github.android?version=latest")
              sz=$(stat -c%s github-app-file 2>/dev/null || echo 0)
              mg=$(head -c 2 github-app-file 2>/dev/null)
              dbg "apkpure-cdn UA=[$PUR_UA] http=$code size=$sz magic=$mg"
              if [ "$mg" = "PK" ] && [ "$sz" -gt 10000000 ]; then break; fi
              rm -f github-app-file
            done
          fi

          # ---- apk4fun ----
          if [ ! -f github-app-file ]; then
            dbg "=== apk4fun ==="
            curl -sL -A "$UA" --max-time 60 "https://www.apk4fun.com/apps/com.github.android/" -o /tmp/a4f.html
            dbg "page size: $(stat -c%s /tmp/a4f.html 2>/dev/null || echo 0)"
            u=$(grep -oE 'https://[^"'"'"' ]+\.apk(\?[^"'"'"' ]*)?' /tmp/a4f.html | grep -viE 'icon|logo' | head -1)
            if [ -z "$u" ]; then
              dl=$(grep -oE 'href="[^"]*download[^"]*"' /tmp/a4f.html | head -1 | sed 's/href="//;s/"//')
              case "$dl" in http*) ;; /*) dl="https://www.apk4fun.com$dl";; *) dl="";; esac
              if [ -n "$dl" ]; then
                curl -sL -A "$UA" -e "https://www.apk4fun.com/apps/com.github.android/" --max-time 60 "$dl" -o /tmp/a4f2.html
                dbg "dl page size: $(stat -c%s /tmp/a4f2.html 2>/dev/null || echo 0)"
                u=$(grep -oE 'https://[^"'"'"' ]+\.apk(\?[^"'"'"' ]*)?' /tmp/a4f2.html | grep -viE 'icon|logo' | head -1)
              fi
            fi
            trydl apk4fun "$u" "https://www.apk4fun.com/" || true
          fi

          # ---- sameapk ----
          if [ ! -f github-app-file ]; then
            dbg "=== sameapk ==="
            curl -sL -A "$UA" --max-time 60 "https://www.sameapk.com/app/com.github.android/" -o /tmp/sam.html
            dbg "page size: $(stat -c%s /tmp/sam.html 2>/dev/null || echo 0)"
            grep -oE 'href="[^"]*"' /tmp/sam.html | grep -iE 'download|\.apk' | sort -u | head -6 | while read -r l; do dbg "  link: $l"; done
            u=$(grep -oE 'https://[^"'"'"' ]+\.apk(\?[^"'"'"' ]*)?' /tmp/sam.html | grep -viE 'icon|logo' | head -1)
            [ -z "$u" ] && u=$(grep -oE 'href="[^"]*download[^"]*"' /tmp/sam.html | head -1 | sed 's/href="//;s/"//')
            case "$u" in http*) ;; /*) u="https://www.sameapk.com$u";; esac
            trydl sameapk "$u" "https://www.sameapk.com/" || true
          fi

          # ---- apk.center ----
          if [ ! -f github-app-file ]; then
            dbg "=== apk.center ==="
            curl -sL -A "$UA" --max-time 60 "https://apk.center/app_com.github.android.html" -o /tmp/ctr.html
            dbg "page size: $(stat -c%s /tmp/ctr.html 2>/dev/null || echo 0)"
            u=$(grep -oE 'https://[^"'"'"' ]+\.apk(\?[^"'"'"' ]*)?' /tmp/ctr.html | grep -viE 'icon|logo' | head -1)
            [ -z "$u" ] && u=$(grep -oE 'href="[^"]*download[^"]*"' /tmp/ctr.html | head -1 | sed 's/href="//;s/"//')
            case "$u" in http*) ;; /*) u="https://apk.center$u";; esac
            trydl apkcenter "$u" "https://apk.center/" || true
          fi

          # ---- 9apps ----
          if [ ! -f github-app-file ]; then
            dbg "=== 9apps ==="
            curl -sL -A "$UA" --max-time 60 "https://www.9apps.com/android-apps/GitHub/" -o /tmp/nine.html
            dbg "page size: $(stat -c%s /tmp/nine.html 2>/dev/null || echo 0)"
            u=$(grep -oE 'https://[^"'"'"' ]+\.apk(\?[^"'"'"' ]*)?' /tmp/nine.html | grep -viE 'icon|logo' | head -1)
            trydl 9apps "$u" "https://www.9apps.com/" || true
          fi

          # ---- uptodown curl retry ----
          if [ ! -f github-app-file ]; then
            dbg "=== uptodown curl ==="
            curl -sL -A "$UA" --max-time 60 "https://github-android.en.uptodown.com/android/download" -o /tmp/uto.html
            dbg "page size: $(stat -c%s /tmp/uto.html 2>/dev/null || echo 0)"
            grep -oE '(dw\.uptodown|post-download|data-url)[^"'"'"' ]*' /tmp/uto.html | sort -u | head -10 | while read -r l; do dbg "  ref: $l"; done
            u=$(grep -oE '(https:)?//[^"'"'"' ]*(dw\.uptodown|dwn/)[^"'"'"' ]*' /tmp/uto.html | head -1)
            case "$u" in //*) u="https:$u";; esac
            trydl uptodown "$u" "https://github-android.en.uptodown.com/android/download" || true
          fi

          exit 0

      - name: Setup Playwright
        if: steps.decide.outputs.mode == 'fetch'
        run: |
          sudo apt-get update -qq 2>&1 | tail -1
          sudo apt-get install -y -qq xvfb 2>&1 | tail -1
          npm install playwright@1.49.0 --no-save 2>&1 | tail -1
          npx playwright install chromium --with-deps 2>&1 | tail -3

      - name: Browser download attempt
        if: steps.decide.outputs.mode == 'fetch'
        run: |
          set +e
          if [ -f github-app-file ]; then
            echo "already have file from curl sources, skipping browser" | tee -a diag.txt
            exit 0
          fi
          cat > dl-browser.js << 'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36';
          const log = (m) => { console.log(m); fs.appendFileSync('diag.txt', m + '\n'); };

          async function waitCf(page, tries) {
            for (let i = 0; i < tries; i++) {
              const t = await page.title().catch(() => '');
              if (t && !/just a moment|attention required/i.test(t)) return true;
              log('cf wait ' + i + ': ' + t);
              await page.waitForTimeout(5000);
            }
            return false;
          }

          (async () => {
            const browser = await chromium.launch({
              headless: false,
              args: ['--disable-blink-features=AutomationControlled', '--no-sandbox']
            });
            const ctx = await browser.newContext({ userAgent: UA, acceptDownloads: true, locale: 'en-US', viewport: { width: 1280, height: 800 } });
            await ctx.addInitScript(() => {
              Object.defineProperty(navigator, 'webdriver', { get: () => undefined });
              Object.defineProperty(navigator, 'languages', { get: () => ['en-US', 'en'] });
              window.chrome = window.chrome || { runtime: {} };
            });
            const page = await ctx.newPage();

            const allReqs = [];
            page.on('request', r => allReqs.push(r.method() + ' ' + r.url()));
            page.on('response', async (resp) => {
              try {
                const u = resp.url();
                const ct = resp.headers()['content-type'] || '';
                if (/json/i.test(ct) && /uptodown/i.test(u)) {
                  const body = await resp.text().catch(() => '');
                  if (/dw\.uptodown|\.apk|\.xapk/i.test(body)) {
                    log('JSON RESP ' + u + ' => ' + body.slice(0, 400));
                    const m = body.match(/https:[^"]+\.(x?apk)[^"]*/i);
                    if (m && !fs.existsSync('candidate-url.txt')) {
                      fs.writeFileSync('candidate-url.txt', m[0].replace(/\\\//g, '/'));
                      log('candidate from json: ' + m[0]);
                    }
                  }
                }
              } catch (e) {}
            });

            // ---- Uptodown ----
            try {
              log('=== UPTODOWN BROWSER ===');
              for (let att = 0; att < 3; att++) {
                try {
                  await page.goto('https://github-android.en.uptodown.com/android/download', { waitUntil: 'domcontentloaded', timeout: 90000 });
                  const t0 = await page.title().catch(() => '');
                  if (t0 && t0.length > 2) break;
                  log('goto attempt ' + att + ' empty title, retrying');
                  await page.waitForTimeout(5000);
                } catch (e) { log('goto err ' + att + ': ' + String(e.message).split('\n')[0]); await page.waitForTimeout(5000); }
              }
              const cfOk = await waitCf(page, 6);
              log('cf passed: ' + cfOk + ' title: ' + (await page.title()));
              await page.waitForTimeout(4000);

              // dump elements carrying data-url / data-* download hints
              const durl = await page.$$eval('[data-url], [data-href], [data-link]', els => els.map(e => e.tagName + ' data-url=' + (e.getAttribute('data-url') || e.getAttribute('data-href') || e.getAttribute('data-link'))).slice(0, 10));
              durl.forEach(x => log('  data-attr: ' + x));
              // scan raw HTML for direct links / post-download refs
              const html = await page.content();
              const dwm = html.match(/https?:\/\/[^"'\s]*(dw\.uptodown|post-download)[^"'\s]*/gi) || [];
              [...new Set(dwm)].slice(0, 10).forEach(x => log('  html-dw: ' + x));
              const btnHtml = await page.$$eval('button', els => els.map(e => e.outerHTML.replace(/\s+/g, ' ').slice(0, 200)).slice(0, 10));
              btnHtml.forEach(x => log('  btn: ' + x));
              const dlBtnHtml = await page.evaluate(() => { const b = document.querySelector('#detail-download-button'); return b ? b.outerHTML.replace(/\s+/g, ' ') : 'NOT FOUND'; });
              log('  detail-download-button FULL: ' + dlBtnHtml.slice(0, 800));
              // dump inline script snippets mentioning download
              const scripts = await page.$$eval('script:not([src])', els => els.map(e => (e.textContent || '').slice(0, 3000)).filter(t => /dw\.uptodown|download/i.test(t)).slice(0, 3));
              scripts.forEach(t => log('  script: ' + t.replace(/\s+/g, ' ').slice(0, 500)));

              const btn = page.locator('#detail-download-button').first();
              if (await btn.count() > 0) {
                log('clicking download button (native click)');
                const dlP = page.waitForEvent('download', { timeout: 45000 }).catch(() => null);
                await btn.click({ timeout: 10000 }).catch(e => log('click err: ' + String(e.message).split('\n')[0]));
                // also wait for possible xhr
                const respP = page.waitForResponse(r => /download|dwn|\.apk/i.test(r.url()), { timeout: 30000 }).catch(() => null);
                const dl = await Promise.race([dlP, (async () => { await respP; return null; })()]);
                if (dl) {
                  log('DOWNLOAD EVENT: ' + dl.suggestedFilename());
                  await dl.saveAs('github-app-file');
                } else {
                  await page.waitForTimeout(15000);
                  const dl2 = await dlP;
                  if (dl2) { log('LATE DOWNLOAD EVENT: ' + dl2.suggestedFilename()); await dl2.saveAs('github-app-file'); }
                  log('url now: ' + page.url());
                }
              } else { log('no download button found'); }

              log('--- all network requests (filtered):');
              allReqs.filter(u => /download|dwn|\.apk|\.xapk|api|json/i.test(u)).slice(0, 40).forEach(u => log('  ' + u.slice(0, 220)));
              log('--- all requests after click (unfiltered, last 30):');
              allReqs.slice(-30).forEach(u => log('  R: ' + u.slice(0, 200)));
              const dw = allReqs.map(u => u.replace(/^\w+ /, '')).find(u => /dw\.uptodown|dwn\//i.test(u));
              if (!fs.existsSync('github-app-file') && dw && !fs.existsSync('candidate-url.txt')) {
                fs.writeFileSync('candidate-url.txt', dw);
                log('candidate: ' + dw);
              }
            } catch (e) { log('uptodown err: ' + String(e.message).split('\n')[0]); }

            // ---- APKPure (browser retry) ----
            if (!fs.existsSync('github-app-file') && !fs.existsSync('candidate-url.txt')) {
              try {
                log('=== APKPURE BROWSER ===');
                allReqs.length = 0;
                await page.goto('https://apkpure.net/github/com.github.android/download', { waitUntil: 'domcontentloaded', timeout: 90000 });
                const cfOk2 = await waitCf(page, 6);
                log('cf passed: ' + cfOk2 + ' title: ' + (await page.title()));
                if (cfOk2) {
                  await page.waitForTimeout(3000);
                  const el = page.locator('a:has-text("Download"), button:has-text("Download")').first();
                  if (await el.count() > 0) {
                    const dlP = page.waitForEvent('download', { timeout: 45000 }).catch(() => null);
                    await el.click().catch(e => log('click err: ' + String(e.message).split('\n')[0]));
                    const dl = await dlP;
                    if (dl) { log('DOWNLOAD EVENT: ' + dl.suggestedFilename()); await dl.saveAs('github-app-file'); }
                  }
                  const pu = allReqs.map(u => u.replace(/^\w+ /, '')).find(u => /\.apk/i.test(u));
                  if (!fs.existsSync('github-app-file') && pu) {
                    fs.writeFileSync('candidate-url.txt', pu);
                    log('candidate: ' + pu);
                  }
                }
              } catch (e) { log('apkpure err: ' + String(e.message).split('\n')[0]); }
            }

            await browser.close();
            log('=== BROWSER DONE ===');
          })().catch(e => { log('FATAL: ' + e.message); process.exit(1); });
          EOF
          xvfb-run -a node dl-browser.js 2>&1 | tee -a diag.txt
          exit 0

      - name: Process downloaded file
        if: always() && steps.decide.outputs.mode == 'fetch'
        run: |
          set +e
          dbg() { echo "$@" | tee -a diag.txt; }
          dbg "--- processing ---"
          if [ ! -f github-app-file ] && [ -f candidate-url.txt ]; then
            u=$(cat candidate-url.txt)
            dbg "retrying via curl: $u"
            ref=$(echo "$u" | sed -E 's#(https://[^/]+).*#\1#')
            code=$(curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36" -e "$ref/" --max-time 300 -o github-app-file -w "%{http_code}" "$u")
            dbg "curl result: http=$code size=$(stat -c%s github-app-file 2>/dev/null)"
          fi
          if [ -f github-app-file ]; then
            magic=$(head -c 2 github-app-file)
            size=$(stat -c%s github-app-file)
            dbg "file: magic=$magic size=$size"
            if [ "$magic" = "PK" ]; then
              if unzip -l github-app-file 2>/dev/null | grep -q " manifest.json"; then
                dbg "XAPK detected - extracting"
                rm -rf xapk && mkdir xapk
                unzip -o -q github-app-file -d xapk
                base=$(cd xapk && ls -S *.apk 2>/dev/null | head -1)
                dbg "base apk: $base ($(stat -c%s xapk/$base 2>/dev/null) bytes)"
                if [ -n "$base" ]; then
                  cp "xapk/$base" "GitHub-Android-from-xapk.apk"
                  cp github-app-file "GitHub-Android-full.xapk"
                fi
              else
                dbg "plain APK"
                cp github-app-file "GitHub-Android-direct.apk"
              fi
            else
              dbg "NOT a zip/apk - first bytes: $(head -c 100 github-app-file | tr -d '\n')"
            fi
          else
            dbg "NO FILE DOWNLOADED"
            cp diag.txt DIAGNOSTICS.txt
          fi
          exit 0

      - name: Create release (APK or diagnostics)
        if: always() && steps.decide.outputs.mode == 'fetch'
        run: |
          set +e
          gh release delete apk-tmp --repo YSkali/DesktopPet --yes --cleanup-tag 2>/dev/null
          if ls GitHub-Android-*.apk GitHub-Android-*.xapk >/dev/null 2>&1; then
            gh release create apk-tmp --repo YSkali/DesktopPet GitHub-Android-*.apk GitHub-Android-*.xapk \
              --title "GitHub for Android APK (temp)" \
              --notes "Auto-fetched installer for personal use. Safe to delete."
          elif [ -f DIAGNOSTICS.txt ]; then
            gh release create apk-tmp --repo YSkali/DesktopPet DIAGNOSTICS.txt \
              --title "Fetch FAILED - diagnostics" \
              --notes "All mirrors failed; diagnostics attached."
          else
            gh release create apk-tmp --repo YSkali/DesktopPet --title "EMPTY" --notes "no diag produced"
          fi

      - name: Push diag file to repo
        if: always() && steps.decide.outputs.mode == 'fetch'
        run: |
          set +e
          [ -f diag.txt ] || exit 0
          B64=$(base64 -w0 diag.txt)
          sha=$(gh api /repos/YSkali/DesktopPet/contents/diag-report.txt --jq .sha 2>/dev/null)
          if [ -n "$sha" ]; then
            gh api -X PUT /repos/YSkali/DesktopPet/contents/diag-report.txt \
              -f message="diag update" -f content="$B64" -f sha="$sha" 2>&1 | head -c 200
          else
            gh api -X PUT /repos/YSkali/DesktopPet/contents/diag-report.txt \
              -f message="diag update" -f content="$B64" 2>&1 | head -c 200
          fi

      - name: Cleanup release and diag
        if: steps.decide.outputs.mode == 'cleanup'
        run: |
          set +e
          gh release delete apk-tmp --repo YSkali/DesktopPet --yes --cleanup-tag 2>/dev/null
          sha=$(gh api /repos/YSkali/DesktopPet/contents/diag-report.txt --jq .sha 2>/dev/null)
          if [ -n "$sha" ]; then
            gh api -X DELETE /repos/YSkali/DesktopPet/contents/diag-report.txt \
              -f message="remove diag" -f sha="$sha" 2>/dev/null
          fi
          echo "cleanup done"
