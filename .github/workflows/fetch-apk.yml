name: Fetch GitHub Android APK (temp)

on:
  push:
    paths:
      - '.github/workflows/fetch-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Decide action (fetch or cleanup)
        id: decide
        run: |
          MSG="${{ github.event.head_commit.message }}"
          if echo "$MSG" | grep -qi '\[cleanup\]'; then
            echo "mode=cleanup" >> "$GITHUB_OUTPUT"
          else
            echo "mode=fetch" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Playwright
        if: steps.decide.outputs.mode == 'fetch'
        run: |
          npm install playwright@1.49.0 --no-save 2>&1 | tail -1
          npx playwright install chromium --with-deps 2>&1 | tail -3

      - name: Browser download attempt
        if: steps.decide.outputs.mode == 'fetch'
        run: |
          cat > /tmp/dl.js << 'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36';
          const log = (m) => { console.log(m); fs.appendFileSync('diag.txt', m + '\n'); };
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const ctx = await browser.newContext({ userAgent: UA, acceptDownloads: true, locale: 'en-US' });
            const page = await ctx.newPage();

            // ---- Uptodown ----
            try {
              log('=== UPTODOWN BROWSER ===');
              await page.goto('https://github-android.en.uptodown.com/android/download', { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForTimeout(3000);
              log('title: ' + (await page.title()));
              const sels = ['#button-download-free', 'button:has-text("Download")', 'a:has-text("Download")', '[data-url*="download"]'];
              let btn = null;
              for (const s of sels) {
                const el = page.locator(s).first();
                if (await el.count() > 0) { btn = el; log('button found: ' + s); break; }
              }
              if (btn) {
                const dlPromise = page.waitForEvent('download', { timeout: 45000 }).catch(e => { log('no dl event: ' + String(e.message).split('\n')[0]); return null; });
                await btn.click().catch(e => log('click err: ' + String(e.message).split('\n')[0]));
                const dl = await dlPromise;
                if (dl) {
                  log('DOWNLOAD EVENT filename=' + dl.suggestedFilename());
                  await dl.saveAs('github-app-file');
                  log('saved github-app-file');
                } else {
                  log('url after click: ' + page.url());
                  fs.writeFileSync('candidate-url.txt', page.url());
                }
              } else { log('no button found'); }
            } catch (e) { log('uptodown err: ' + String(e.message).split('\n')[0]); }

            // ---- APKMirror ----
            if (!fs.existsSync('github-app-file')) {
              try {
                log('=== APKMIRROR BROWSER ===');
                await page.goto('https://www.apkmirror.com/apk/github-inc/github/', { waitUntil: 'domcontentloaded', timeout: 60000 });
                await page.waitForTimeout(3000);
                log('title: ' + (await page.title()));
                const rel = page.locator('a[href*="/apk/github-inc/github/"]:has-text("GitHub")').first();
                if (await rel.count() > 0) {
                  log('release link: ' + (await rel.getAttribute('href')));
                  await rel.click();
                  await page.waitForTimeout(3000);
                  log('on release page: ' + page.url());
                  const dlbtn = page.locator('a:has-text("Download APK"), a.downloadButton, a[href*="/download/"]').first();
                  if (await dlbtn.count() > 0) {
                    const dlPromise = page.waitForEvent('download', { timeout: 60000 }).catch(e => { log('no dl event: ' + String(e.message).split('\n')[0]); return null; });
                    await dlbtn.click().catch(e => log('click err: ' + String(e.message).split('\n')[0]));
                    await page.waitForTimeout(8000);
                    log('apkmirror url now: ' + page.url());
                    const dl2 = await dlPromise;
                    if (dl2) {
                      log('DOWNLOAD EVENT filename=' + dl2.suggestedFilename());
                      await dl2.saveAs('github-app-file');
                      log('saved github-app-file');
                    } else {
                      const here = page.locator('a:has-text("here"), a:has-text("Download"), #download-file').first();
                      if (await here.count() > 0) {
                        const p2 = page.waitForEvent('download', { timeout: 60000 }).catch(() => null);
                        await here.click().catch(() => {});
                        const dl3 = await p2;
                        if (dl3) { log('DL3 filename=' + dl3.suggestedFilename()); await dl3.saveAs('github-app-file'); }
                      }
                    }
                  } else { log('no download button on release page'); }
                } else { log('no release link'); }
              } catch (e) { log('apkmirror err: ' + String(e.message).split('\n')[0]); }
            }

            await browser.close();
            log('=== BROWSER DONE ===');
          })().catch(e => { log('FATAL: ' + e.message); process.exit(1); });
          EOF
          : > diag.txt
          node /tmp/dl.js 2>&1 | tee -a diag.txt
          exit 0

      - name: Process downloaded file
        if: always() && steps.decide.outputs.mode == 'fetch'
        run: |
          set +e
          dbg() { echo "$@" | tee -a diag.txt; }
          dbg "--- processing ---"
          # retry candidate url via curl if browser navigated instead of downloading
          if [ ! -f github-app-file ] && [ -f candidate-url.txt ]; then
            u=$(cat candidate-url.txt)
            dbg "retrying via curl: $u"
            code=$(curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36" --max-time 300 -o github-app-file -w "%{http_code}" "$u")
            dbg "curl result: http=$code size=$(stat -c%s github-app-file 2>/dev/null)"
          fi
          if [ -f github-app-file ]; then
            magic=$(head -c 2 github-app-file)
            size=$(stat -c%s github-app-file)
            dbg "file: magic=$magic size=$size"
            if [ "$magic" = "PK" ]; then
              if unzip -l github-app-file 2>/dev/null | grep -q " manifest.json"; then
                dbg "XAPK detected - extracting"
                rm -rf xapk && mkdir xapk
                unzip -o -q github-app-file -d xapk
                ls -la xapk/ | head -20 | while read -r l; do dbg "  $l"; done
                base=$(cd xapk && ls -S *.apk 2>/dev/null | head -1)
                dbg "base apk: $base ($(stat -c%s xapk/$base 2>/dev/null) bytes)"
                if [ -n "$base" ]; then
                  cp "xapk/$base" "GitHub-Android-from-xapk.apk"
                  cp github-app-file "GitHub-Android-full.xapk"
                fi
              else
                dbg "plain APK"
                cp github-app-file "GitHub-Android-direct.apk"
              fi
            else
              dbg "NOT a zip/apk - first bytes: $(head -c 100 github-app-file | tr -d '\n')"
            fi
          else
            dbg "NO FILE DOWNLOADED"
            cp diag.txt DIAGNOSTICS.txt
          fi
          exit 0

      - name: Create release (APK or diagnostics)
        if: always() && steps.decide.outputs.mode == 'fetch'
        run: |
          set +e
          gh release delete apk-tmp --repo YSkali/DesktopPet --yes --cleanup-tag 2>/dev/null
          if ls GitHub-Android-*.apk GitHub-Android-*.xapk >/dev/null 2>&1; then
            gh release create apk-tmp --repo YSkali/DesktopPet GitHub-Android-*.apk GitHub-Android-*.xapk \
              --title "GitHub for Android APK (temp)" \
              --notes "Auto-fetched installer for personal use. Safe to delete."
          elif [ -f DIAGNOSTICS.txt ]; then
            gh release create apk-tmp --repo YSkali/DesktopPet DIAGNOSTICS.txt \
              --title "Fetch FAILED - diagnostics" \
              --notes "All mirrors failed; diagnostics attached."
          else
            gh release create apk-tmp --repo YSkali/DesktopPet --title "EMPTY" --notes "no diag produced"
          fi

      - name: Push diag file to repo
        if: always() && steps.decide.outputs.mode == 'fetch'
        run: |
          set +e
          [ -f diag.txt ] || exit 0
          B64=$(base64 -w0 diag.txt)
          sha=$(gh api /repos/YSkali/DesktopPet/contents/diag-report.txt --jq .sha 2>/dev/null)
          if [ -n "$sha" ]; then
            gh api -X PUT /repos/YSkali/DesktopPet/contents/diag-report.txt \
              -f message="diag update" -f content="$B64" -f sha="$sha" 2>&1 | head -c 200
          else
            gh api -X PUT /repos/YSkali/DesktopPet/contents/diag-report.txt \
              -f message="diag update" -f content="$B64" 2>&1 | head -c 200
          fi

      - name: Cleanup release and diag
        if: steps.decide.outputs.mode == 'cleanup'
        run: |
          set +e
          gh release delete apk-tmp --repo YSkali/DesktopPet --yes --cleanup-tag 2>/dev/null
          sha=$(gh api /repos/YSkali/DesktopPet/contents/diag-report.txt --jq .sha 2>/dev/null)
          if [ -n "$sha" ]; then
            gh api -X DELETE /repos/YSkali/DesktopPet/contents/diag-report.txt \
              -f message="remove diag" -f sha="$sha" 2>/dev/null
          fi
          echo "cleanup done"
